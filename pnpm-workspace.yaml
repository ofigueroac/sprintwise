packages:
  - apps/*
  - packages/*

catalog:
  # Tooling
  '@eslint/js': ^9.39.5
  eslint: ^9.39.5
  eslint-config-next: 16.3.8
  eslint-config-prettier: ^10.1.8
  globals: ^17.13.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
  prettier: ^3.9.9
  turbo: ^2.11.7
  # typescript-eslint supports typescript <6.1
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  vite: ^8.3.2
  vitest: ^5.0.3
  tsx: ^4.23.15
  tsup: ^8.5.1
  '@types/node': ^24.0.0

  # React / Next
  next: 16.3.8
  next-auth: 5.0.0-beta.32
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  zustand: ^5.0.15

  # Styling / UI
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@base-ui/react': ^1.8.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  lucide-react: ^1.52.0
  tw-animate-css: ^1.4.0
  shadcn: ^4.21.2

  # Data / API
  zod: ^4.6.5
  drizzle-orm: ^0.45.3
  drizzle-kit: ^0.31.11
  postgres: ^3.4.9
  hono: ^4.13.13
  '@hono/node-server': ^2.1.3

  # Agents / AI
  '@langchain/core': ^1.2.17
  '@langchain/langgraph': ^1.4.20
  '@langchain/langgraph-checkpoint-postgres': ^1.0.6
  '@langchain/google-genai': ^2.3.2
  '@ag-ui/core': ^1.0.2
  jose: ^6.2.12

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@shadcn/registry@0.1.1'
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - shadcn@4.21.2
  - typescript-eslint@8.71.1
  - '@langchain/core@1.2.17'
  - '@langchain/langgraph-checkpoint-postgres@1.0.6'
  - '@langchain/langgraph-checkpoint@1.1.6'
  - '@langchain/langgraph-sdk@1.12.2'
  - '@langchain/langgraph@1.4.20'
